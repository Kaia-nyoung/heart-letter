<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>너에게 보내는 하트 💗</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Apple SD Gothic Neo", sans-serif;
      background: linear-gradient(135deg, #ffe0ec, #ffc1d8);
      color: #a53e67;
      text-align: center;
    }
    .card {
      position: relative;
      z-index: 2;
      width: min(90vw, 430px);
      padding: 42px 22px;
      border-radius: 30px;
      background: rgba(255,255,255,.7);
      box-shadow: 0 15px 50px #e887a650;
      backdrop-filter: blur(10px);
    }
    h1 { font-size: 26px; margin: 0 0 12px; }
    p { line-height: 1.8; }
    .heart {
      font-size: 115px;
      cursor: pointer;
      margin: 32px auto;
      animation: beat 1s infinite;
      user-select: none;
    }
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.18); }
    }
    button {
      padding: 15px 30px;
      border: 0;
      border-radius: 30px;
      background: #ff5c95;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 15px #ff5c9550;
    }
    button:hover { background: #ee397e; }
    .letter {
      display: none;
      margin-top: 25px;
      padding: 20px;
      background: white;
      border-radius: 20px;
      animation: appear .7s ease;
    }
    @keyframes appear {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .float {
      position: fixed;
      bottom: -50px;
      pointer-events: none;
      animation: fly linear forwards;
      z-index: 1;
    }
    @keyframes fly {
      to {
        transform: translateY(-115vh) rotate(30deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>💌 너에게 보내는 작은 선물</h1>
    <p>누군가 너에게 하트를 보냈어!</p>

    <div class="heart" id="heart" onclick="openLetter()">
      💗
    </div>

    <p>하트를 눌러봐 ♡</p>
    <button onclick="openLetter()">비밀 편지 열기 💕</button>

    <div class="letter" id="letter">
      <h2>💖 하트 배달 완료! 💖</h2>
      <p>
        잼얘해줘!!
      </p>
      <h2>💗 💖 💕 💘 💝</h2>
    </div>
  </div>

  <script>
    function makeHeart() {
      const heart = document.createElement("div");
      heart.className = "float";
      heart.textContent = ["💗","💖","💕","💘","❤️"][Math.floor(Math.random()*5)];
      heart.style.left = Math.random()*100 + "vw";
      heart.style.fontSize = (15+Math.random()*25) + "px";
      heart.style.animationDuration = (3+Math.random()*4) + "s";
      document.body.appendChild(heart);
      heart.addEventListener("animationend", () => heart.remove());
    }

    setInterval(makeHeart, 300);

    function openLetter() {
      document.getElementById("letter").style.display = "block";
      document.getElementById("heart").textContent = "💖";

      for (let i=0; i<60; i++) {
        setTimeout(makeHeart, i*35);
      }
    }
  </script>
</body>
</html>
